description: MicroPoint Biotechnology (Shenzhen MicroPoint Biotechnology Co., Ltd. / 微点生物)
  is a biochip technology company focused on the R&D, manufacturing and sale of MEMS-based
  Lab-on-a-Chip products. It is one of the few firms to master microfluidic-chip core technology
  at mass-production scale, and describes itself as the only POCT manufacturer that develops and
  produces both the biochips and their companion detection instruments, spanning fluorescence
  immunoassay, electrochemical coagulation testing and infectious-disease (including COVID) diagnostics.
  Surfaced as a portfolio company of Qiming Venture Partners and enriched here; no public developer,
  API, SDK or documentation surface was found.
